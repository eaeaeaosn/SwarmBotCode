; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Flash a specific robot (PowerShell):
;   $env:ROBOT_ID=1; pio run -e swarmbot --target upload
;   $env:ROBOT_ID=2; pio run -e swarmbot --target upload
;
; Monitor (port auto-detected):
;   pio device monitor

; ── Shared settings (inherited by all envs) ──────────────────
[env]
platform               = espressif32
board                  = esp32dev
framework              = arduino
board_microros_transport = wifi
monitor_speed          = 115200
lib_deps =
    https://gitee.com/ohhuo/micro_ros_platformio.git
    fastled/FastLED@^3.9.0

; ── Single environment — pass ROBOT_ID via OS env var ────────
; PowerShell: $env:ROBOT_ID=1; pio run -e swarmbot --target upload
; PowerShell: $env:ROBOT_ID=2; pio run -e swarmbot --target upload
[env:swarmbot]
build_flags = -D ROBOT_ID=${sysenv.ROBOT_ID}
