; PlatformIO Project Configuration File
; https://docs.platformio.org/page/projectconf.html
;
; Flash a specific robot:
;   pio run -e robot1 --target upload
;   pio run -e robot2 --target upload
;
; Monitor (port auto-detected):
;   pio device monitor

; ── Shared settings (inherited by all envs) ──────────────────
[env]
platform               = espressif32
board                  = esp32dev
framework              = arduino
board_microros_transport = wifi
monitor_speed          = 115200
lib_deps =
    https://gitee.com/ohhuo/micro_ros_platformio.git
    fastled/FastLED@^3.9.0

; ── Per-robot environments ────────────────────────────────────
[env:robot1]
build_flags = -D ROBOT_ID=1

[env:robot2]
build_flags = -D ROBOT_ID=2

[env:robot3]
build_flags = -D ROBOT_ID=3
